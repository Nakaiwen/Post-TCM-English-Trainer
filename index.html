<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>後中醫英文單字練習器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe2;
  --bg-soft:#efe5d2;
  --paper:#fdfaf2;
  --ink:#1a1d2a;
  --ink-soft:#3d4252;
  --ink-mute:#6b6e7c;
  --ochre:#a86b2a;
  --ochre-deep:#7d4d1a;
  --sage:#3d5a40;
  --sage-soft:#5b7a5e;
  --brick:#9a3a35;
  --line:#d8cdb6;
  --line-soft:#e8dec9;
  --shadow:0 1px 0 #e3d8bf, 0 8px 24px -12px rgba(60,40,10,.18);
  --serif:'Newsreader','Noto Serif TC',serif;
  --cn:'Noto Serif TC',serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif);
  background:var(--bg);
  color:var(--ink);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(168,107,42,.06),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(61,90,64,.05),transparent 40%);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.app{max-width:780px;margin:0 auto;padding:24px 20px 60px}
header.masthead{
  border-bottom:1px solid var(--line);
  padding:8px 0 22px;
  margin-bottom:28px;
  position:relative;
}
.eyebrow{
  font-family:var(--cn);
  font-size:11.5px;
  letter-spacing:.32em;
  color:var(--ochre);
  text-transform:uppercase;
  font-weight:500;
  margin-bottom:6px;
}
h1.title{
  font-family:var(--serif);
  font-size:34px;
  font-weight:500;
  letter-spacing:-.01em;
  line-height:1.1;
}
h1.title .cn{
  font-family:var(--cn);
  font-weight:500;
  font-size:.78em;
  margin-left:8px;
  color:var(--ink-soft);
}
.sub{
  font-family:var(--cn);
  font-size:13.5px;
  color:var(--ink-mute);
  margin-top:8px;
  letter-spacing:.04em;
}

/* --- Stat strip --- */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:28px;
  font-family:var(--cn);
}
.stat{
  background:var(--paper);
  padding:12px 10px;
  text-align:center;
}
.stat .n{
  font-family:var(--serif);
  font-size:24px;
  font-weight:500;
  color:var(--ink);
  line-height:1;
}
.stat .l{
  font-size:10.5px;
  color:var(--ink-mute);
  letter-spacing:.18em;
  margin-top:6px;
  text-transform:uppercase;
}

/* --- Mode cards --- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:36px}
.mode{
  background:var(--paper);
  border:1px solid var(--line);
  padding:18px 16px 16px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  font:inherit;
  color:inherit;
  display:block;
  position:relative;
  overflow:hidden;
}
.mode::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,transparent 60%,rgba(168,107,42,.06));
  opacity:0;
  transition:opacity .2s;
}
.mode:hover{border-color:var(--ochre);transform:translateY(-1px);box-shadow:var(--shadow)}
.mode:hover::before{opacity:1}
.mode .num{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ochre);
  letter-spacing:.1em;
  display:block;
  margin-bottom:8px;
}
.mode .t{
  font-family:var(--cn);
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:4px;
  line-height:1.3;
}
.mode .t-en{
  font-style:italic;
  font-size:14px;
  color:var(--ink-soft);
  margin-bottom:10px;
}
.mode .d{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  line-height:1.5;
}

/* --- Section heading --- */
.sec-h{
  font-family:var(--cn);
  font-size:11.5px;
  letter-spacing:.3em;
  color:var(--ochre);
  text-transform:uppercase;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.sec-h .right{
  font-size:11px;
  color:var(--ink-mute);
  letter-spacing:.1em;
  text-transform:none;
}

/* --- Trajectory section (learning curve) --- */
.traj-controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}
.traj-chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 12px 7px 10px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:18px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-soft);
  cursor:pointer;
  user-select:none;
  transition:border-color .15s,color .15s;
}
.traj-chip input{
  appearance:none;
  -webkit-appearance:none;
  width:13px;
  height:13px;
  border:1.5px solid var(--ink-mute);
  border-radius:3px;
  position:relative;
  cursor:pointer;
  margin:0;
  flex-shrink:0;
  transition:all .15s;
}
.traj-chip input:checked{
  background:var(--swatch,var(--ochre));
  border-color:var(--swatch,var(--ochre));
}
.traj-chip input:checked::after{
  content:'';
  position:absolute;
  left:3px;top:0px;
  width:4px;height:8px;
  border:solid #fdfaf2;
  border-width:0 1.8px 1.8px 0;
  transform:rotate(45deg);
}
.traj-chip:has(input:checked){
  border-color:var(--swatch,var(--ochre));
  color:var(--ink);
}
.traj-chart{
  background:var(--paper);
  border:1px solid var(--line);
  padding:10px 6px 4px;
  margin-bottom:28px;
  min-height:180px;
}
.traj-svg{
  display:block;
  width:100%;
  height:auto;
}
.traj-empty{
  text-align:center;
  color:var(--ink-mute);
  font-family:var(--cn);
  font-size:13px;
  padding:64px 20px 60px;
  letter-spacing:.06em;
}
@media (max-width:520px){
  .traj-chip{font-size:12px;padding:6px 10px 6px 9px}
  .traj-empty{padding:48px 16px 44px;font-size:12.5px}
}

/* --- Practice screen --- */
.practice{
  background:var(--paper);
  border:1px solid var(--line);
  padding:24px 22px 20px;
  margin-bottom:18px;
  position:relative;
}
.p-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line-soft);
}
.p-mode{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ochre);
  letter-spacing:.15em;
  text-transform:uppercase;
}
.p-prog{
  font-family:var(--mono);
  font-size:12px;
  color:var(--ink-mute);
}
.p-close{
  background:none;border:none;
  font-family:var(--serif);
  font-size:18px;
  color:var(--ink-mute);
  cursor:pointer;
  padding:4px 10px;
}
.p-close:hover{color:var(--ink)}

.q-prompt{
  font-family:var(--cn);
  font-size:13px;
  color:var(--ink-mute);
  margin-bottom:14px;
  letter-spacing:.05em;
}
.q-stem{
  font-family:var(--serif);
  font-size:20px;
  line-height:1.6;
  color:var(--ink);
  margin-bottom:24px;
}
.q-stem.passage{font-size:18px;line-height:1.75}
.q-stem .blank{
  display:inline-block;
  min-width:90px;
  border-bottom:2px solid var(--ochre);
  padding:0 6px;
  margin:0 2px;
  font-family:var(--mono);
  font-size:.92em;
  color:var(--ochre);
  text-align:center;
}
.q-stem .blank.filled{
  color:var(--sage);
  border-bottom-color:var(--sage);
}
.q-stem .blank.wrong{
  color:var(--brick);
  border-bottom-color:var(--brick);
}

.q-target{
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
  font-size:34px;
  color:var(--ink);
  text-align:center;
  margin:8px 0 6px;
  letter-spacing:-.01em;
}
.q-target-pos{
  text-align:center;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ochre);
  letter-spacing:.15em;
  margin-bottom:22px;
}
.q-target-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:8px 0 6px;
}
.speak-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--ochre);
  width:38px;height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:all .15s;
  flex-shrink:0;
}
.speak-btn:hover{background:var(--bg-soft);border-color:var(--ochre)}
.speak-btn:active{transform:scale(.95)}
/* Small inline speak button for use within text */
.speak-btn-mini{
  background:none;
  border:1px solid var(--line);
  color:var(--ochre);
  width:22px;height:22px;
  border-radius:50%;
  cursor:pointer;
  font-size:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  vertical-align:middle;
  margin:0 2px;
  padding:0;
  transition:all .15s;
}
.speak-btn-mini:hover{background:var(--bg-soft);border-color:var(--ochre);color:var(--ochre-deep)}
.speak-btn-mini:active{transform:scale(.92)}

/* --- Options --- */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.opt{
  background:var(--bg-soft);
  border:1px solid var(--line);
  padding:13px 16px;
  font-family:var(--serif);
  font-size:17px;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  align-items:center;
  gap:12px;
  font:inherit;
  width:100%;
}
.opt:hover:not(:disabled){border-color:var(--ochre);background:#f3e8d0}
.opt:disabled{cursor:default}
.opt .letter{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ochre);
  letter-spacing:.1em;
  width:18px;
  flex-shrink:0;
}
.opt .word{flex:1;font-style:italic;font-weight:500}
.opt .word.plain{font-style:normal;font-weight:400}
.opt.correct{
  background:#e6efdc;
  border-color:var(--sage);
  color:var(--sage);
}
.opt.correct .letter{color:var(--sage)}
.opt.wrong{
  background:#f3dcd8;
  border-color:var(--brick);
  color:var(--brick);
}
.opt.wrong .letter{color:var(--brick)}

/* --- Listen mode UI --- */
.listen-area{
  text-align:center;
  padding:18px 0 8px;
}
.listen-big{
  width:78px;height:78px;
  border-radius:50%;
  border:1.5px solid var(--ochre);
  background:var(--paper);
  color:var(--ochre);
  font-size:28px;
  cursor:pointer;
  margin-bottom:12px;
  transition:all .15s;
}
.listen-big:hover{background:var(--bg-soft)}
.listen-big:active{transform:scale(.95)}
.listen-hint{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  margin-bottom:18px;
  letter-spacing:.05em;
}

/* --- Feedback --- */
.feedback{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  background:var(--bg-soft);
  font-family:var(--cn);
  font-size:14px;
  color:var(--ink-soft);
  line-height:1.65;
  display:none;
}
.feedback.show{display:block}
.feedback .fb-tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.feedback.ok .fb-tag{color:var(--sage)}
.feedback.ng .fb-tag{color:var(--brick)}
.feedback .ans-word{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  color:var(--ochre-deep);
}
.feedback .ans-zh{font-weight:500;color:var(--ink)}
.feedback .ex{
  margin-top:8px;
  font-style:italic;
  font-family:var(--serif);
  color:var(--ink-soft);
  font-size:14.5px;
  line-height:1.5;
}
.feedback .ex u{
  text-decoration:none;
  background:linear-gradient(transparent 60%,rgba(168,107,42,.25) 0);
  padding:0 2px;
}
.feedback .root-tag{
  margin-top:6px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--sage);
  letter-spacing:.05em;
}
.feedback .root-tag em{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  color:var(--sage);
}
.root-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:10px;
  margin-bottom:24px;
}
.root-card{
  background:var(--paper);
  border:1px solid var(--line);
  padding:14px 12px 12px;
  text-align:left;
  cursor:pointer;
  transition:all .15s ease;
  font:inherit;
  color:inherit;
}
.root-card:hover{
  border-color:var(--sage);
  background:#f0e9d8;
  transform:translateY(-1px);
}
.root-card .root-name{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  font-size:18px;
  color:var(--sage);
  margin-bottom:2px;
}
.root-card .root-gloss{
  font-family:var(--serif);
  font-size:12px;
  color:var(--ink-mute);
  font-style:italic;
  margin-bottom:6px;
  min-height:1.2em;
}
.root-card .root-count{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ochre);
  letter-spacing:.05em;
}
.feedback .src-tag{
  margin-top:10px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ochre-deep);
  letter-spacing:.05em;
}
.feedback .conf-note{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
  font-size:13px;
}

/* --- Footer actions --- */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.btn{
  flex:1;
  padding:13px 18px;
  font-family:var(--cn);
  font-size:14.5px;
  font-weight:500;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
  letter-spacing:.05em;
  transition:all .15s;
}
.btn:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg-soft);border-color:var(--ink-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* --- Recent words / weak words --- */
.weak-list{
  background:var(--paper);
  border:1px solid var(--line);
  padding:18px 20px;
  margin-bottom:18px;
}
.weak-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px dotted var(--line-soft);
  font-size:15px;
  align-items:center;
  gap:12px;
}
.weak-row:last-child{border-bottom:none}
.weak-row .ww{
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
}
.weak-row .wzh{font-family:var(--cn);font-size:13px;color:var(--ink-soft);flex:1;text-align:right}
.weak-row .wstat{font-family:var(--mono);font-size:11px;color:var(--brick);min-width:40px;text-align:right}
.weak-empty{font-family:var(--cn);font-size:13px;color:var(--ink-mute);text-align:center;padding:14px 0}

/* --- Settings --- */
.settings-bar{
  display:flex;
  gap:8px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  margin-bottom:18px;
  flex-wrap:wrap;
}
.settings-bar .s-link{
  cursor:pointer;
  border-bottom:1px dotted var(--ink-mute);
  letter-spacing:.05em;
}
.settings-bar .s-link:hover{color:var(--ochre);border-color:var(--ochre)}

.modal-bg{
  position:fixed;inset:0;
  background:rgba(26,29,42,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);
  border:1px solid var(--ink);
  max-width:440px;
  width:100%;
  padding:26px 24px 22px;
  max-height:85vh;
  overflow-y:auto;
}
.modal h3{
  font-family:var(--serif);
  font-weight:500;
  font-size:22px;
  margin-bottom:18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  font-family:var(--cn);
  font-size:14px;
  border-bottom:1px dotted var(--line-soft);
  gap:12px;
}
.setting-row:last-of-type{border-bottom:none}
.setting-row label{flex:1}
.setting-row select,.setting-row input[type=number]{
  font-family:var(--serif);
  font-size:14px;
  padding:6px 10px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  min-width:90px;
}
.setting-row .danger{color:var(--brick);border-color:var(--brick);background:transparent;padding:6px 12px;cursor:pointer;font-family:var(--cn);font-size:13px}

/* --- Done screen --- */
.done{
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px 24px;
  text-align:center;
}
.done .big-num{
  font-family:var(--serif);
  font-size:64px;
  font-weight:300;
  color:var(--ochre);
  line-height:1;
  margin-bottom:8px;
}
.done .big-num .slash{color:var(--ink-mute);font-size:.6em;font-weight:300}
.done .ratio-l{
  font-family:var(--cn);
  font-size:13px;
  color:var(--ink-mute);
  letter-spacing:.2em;
  margin-bottom:24px;
}
.done .msg{
  font-family:var(--cn);
  font-size:15px;
  color:var(--ink-soft);
  margin-bottom:24px;
  line-height:1.7;
}

/* --- Mobile --- */
@media (max-width:520px){
  body{font-size:16px}
  .app{padding:18px 14px 50px}
  h1.title{font-size:26px}
  h1.title .cn{display:block;margin-left:0;margin-top:4px;font-size:.65em}
  .stats{grid-template-columns:repeat(2,1fr)}
  .modes{grid-template-columns:1fr;gap:10px}
  .practice{padding:18px 16px 16px}
  .q-stem{font-size:18px}
  .q-stem.passage{font-size:16.5px}
  .q-target{font-size:28px}
  .opt{font-size:15.5px;padding:12px 14px}
  .actions{flex-direction:column;gap:8px}
}

/* --- Misc --- */
.tag-confused{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  background:var(--ochre);
  color:var(--paper);
  padding:2px 8px;
  margin-left:8px;
  vertical-align:middle;
  text-transform:uppercase;
}
.derived-list{
  margin-top:6px;
  font-size:13.5px;
  color:var(--ink-mute);
  font-family:var(--cn);
}
.derived-list em{font-family:var(--serif);font-style:italic;color:var(--ink-soft)}

footer.foot{
  margin-top:40px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-family:var(--cn);
  font-size:11.5px;
  color:var(--ink-mute);
  text-align:center;
  letter-spacing:.1em;
  line-height:1.7;
}
footer.foot em{font-style:normal;color:var(--ochre)}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>設定 · Settings</h3>
    <div class="setting-row">
      <label>每日題數</label>
      <input type="number" id="setDaily" min="5" max="100" step="5">
    </div>
    <div class="setting-row">
      <label>發音語速</label>
      <select id="setRate">
        <option value="0.7">慢 (0.7×)</option>

    </div>

        <option value="en-US">美式 American</option>
        <option value="en-GB">英式 British</option>
        <option value="en-AU">澳洲 Australian</option>
      </select>
    </div>
    <div class="setting-row">
      <label>每題完成後自動讀音</label>
      <select id="setAutoSpeak">
        <option value="1">開啟</option>
        <option value="0">關閉</option>
      </select>
    </div>
    <div class="setting-row">
      <label>試聽當前語音</label>
      <button class="speak-btn" onclick="testVoice()" title="試聽">▶</button>
    </div>
    <div class="setting-row">
      <label>清除所有學習進度</label>
      <button class="danger" onclick="resetAll()">重置</button>
    </div>
    <div style="margin-top:18px;text-align:right">
      <button class="btn" style="flex:none;padding:9px 22px" onclick="closeSettings()">關閉</button>
    </div>
  </div>
</div>

/* ============================================================
   STORAGE
   ============================================================ */
const STORE_KEY = "hzy_vocab_v1";
const SETTINGS_KEY = "hzy_vocab_settings_v1";
function loadStore(){
  try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r)}catch(e){}
  return {wordStats:{},sessions:[]};
}
function saveStore(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch(e){}}
function loadSettings(){
  try{const r=localStorage.getItem(SETTINGS_KEY);if(r)return Object.assign({},DEFAULT_SETTINGS,JSON.parse(r))}catch(e){}
  return Object.assign({},DEFAULT_SETTINGS);
}
function saveSettings(s){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}catch(e){}}
const DEFAULT_SETTINGS = {dailyTarget:20,speechRate:0.85,autoSpeak:1,speechAccent:'en-US'};

let store = loadStore();
let settings = loadSettings();

/* per-word stats: {seen, correct, wrong, lastSeen, dueAt} */
function getStat(w){
  if(!store.wordStats[w]) store.wordStats[w]={seen:0,correct:0,wrong:0,lastSeen:0,dueAt:0};
  return store.wordStats[w];
}
function recordResult(w, isCorrect){
  const st = getStat(w);
  st.seen++;
  if(isCorrect) st.correct++; else st.wrong++;
  st.lastSeen = Date.now();
  // simple spaced-repetition: correct → push out further; wrong → review soon
  const now = Date.now();
  const day = 86400000;
  if(isCorrect){
    const streak = Math.max(0, st.correct - st.wrong);
    const interval = [1,2,4,7,15,30,60][Math.min(streak,6)] || 60;
    st.dueAt = now + interval*day;
  }else{
    st.dueAt = now + 0.5*day;
  }
  saveStore(store);
}

/* ============================================================
   TODAY SESSION TRACKER
   ============================================================ */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function getTodaySession(){
  let t = store.sessions.find(s=>s.date===todayKey());
  if(!t){t={date:todayKey(),attempted:0,correct:0};store.sessions.push(t);saveStore(store)}
  return t;
}
function bumpToday(isCorrect){
  const t=getTodaySession();
  t.attempted++;
  if(isCorrect)t.correct++;
  saveStore(store);
}

/* ============================================================
   LEARNING TRAJECTORY (toggleable curves)
   ============================================================ */
let trajState = {attempts:false, accuracy:false, cumulative:false, due:false};
// Restore prior chip selections from settings
if(Array.isArray(settings.trajChips)){
  settings.trajChips.forEach(k => { if(k in trajState) trajState[k] = true });
}

function updateTraj(key, checked){
  trajState[key] = checked;
  settings.trajChips = Object.keys(trajState).filter(k => trajState[k]);
  saveSettings(settings);
  const el = document.getElementById('trajChart');
  if(el) el.innerHTML = renderTrajChart(trajState);
}

function getSessionsHistory(days){
  const out = [];
  for(let i = days-1; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
    const s = (store.sessions||[]).find(s => s.date === key);
    out.push({offset: -i, date: key, attempted: s?s.attempted:0, correct: s?s.correct:0});
  }
  return out;
}

function getReviewForecast(days){
  const out = [];
  const now = Date.now();
  const dayMs = 86400000;
  // Bucket 0 = overdue + due today
  const todayDue = Object.values(store.wordStats||{})
    .filter(st => st.seen > 0 && st.dueAt > 0 && st.dueAt < now+dayMs).length;
  out.push({offset: 0, dueCount: todayDue});
  for(let i = 1; i <= days; i++){
    const start = now + i*dayMs;
    const end = now + (i+1)*dayMs;
    const c = Object.values(store.wordStats||{})
      .filter(st => st.dueAt >= start && st.dueAt < end).length;
    out.push({offset: i, dueCount: c});
  }
  return out;
}

function niceCeil(x){
  if(x <= 5) return 5;
  if(x <= 10) return 10;
  if(x <= 20) return 20;
  if(x <= 50) return 50;
  if(x <= 100) return 100;
  if(x <= 200) return 200;
  if(x <= 500) return 500;
  if(x <= 1000) return 1000;
  if(x <= 2000) return 2000;
  return Math.ceil(x/1000)*1000;
}

function renderTrajChart(state){
  const anyChecked = state.attempts || state.accuracy || state.cumulative || state.due;
  if(!anyChecked){
    return `<div class="traj-empty">勾選上方項目顯示曲線</div>`;
  }

  const isMobile = window.innerWidth < 520;
  const W = isMobile ? 380 : 600;
  const H = isMobile ? 240 : 280;
  // Right margin grows when 1 or 2 right-axis metrics are on
  const showAcc = state.accuracy, showCum = state.cumulative;
  const rightAxisCount = (showAcc?1:0) + (showCum?1:0);
  const rightMargin = rightAxisCount === 2 ? (isMobile?78:88)
                    : rightAxisCount === 1 ? (isMobile?40:50)
                    : (isMobile?16:22);
  const M = {top:14, right:rightMargin, bottom:34, left:isMobile?38:46};
  const innerW = W - M.left - M.right;
  const innerH = H - M.top - M.bottom;

  const hasPast = state.attempts || state.accuracy || state.cumulative;
  const hasFuture = state.due;
  const xMin = hasPast ? -29 : 0;
  const xMax = hasFuture ? 14 : 0;
  const xRange = xMax - xMin + 1;

  const past = hasPast ? getSessionsHistory(30) : [];
  const future = hasFuture ? getReviewForecast(14) : [];

  // Left axis: daily counts only (bars). Cumulative gets its own right axis.
  let dailyMax = 5;
  if(state.attempts) dailyMax = Math.max(dailyMax, ...past.map(p=>p.attempted));
  if(state.due) dailyMax = Math.max(dailyMax, ...future.map(f=>f.dueCount));
  dailyMax = niceCeil(dailyMax);

  // Cumulative on its own scale
  let cumMax = 0, cumPoints = [];
  if(state.cumulative){
    let cum = 0;
    cumPoints = past.map(p => { cum += p.attempted; return {offset:p.offset, value:cum}; });
    cumMax = niceCeil(cumPoints.length ? cumPoints[cumPoints.length-1].value : 5);
    if(cumMax < 5) cumMax = 5;
  }

  const xScale = x => M.left + ((x - xMin) / xRange) * innerW;
  const dayW = innerW / xRange;
  const y1 = v => M.top + innerH - (Math.max(0,v) / dailyMax) * innerH;
  const y2 = v => M.top + innerH - (Math.max(0,Math.min(100,v)) / 100) * innerH;
  const y3 = v => cumMax ? M.top + innerH - (Math.max(0,v) / cumMax) * innerH : M.top+innerH;

  const fs = isMobile ? 11 : 10;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="traj-svg" preserveAspectRatio="xMidYMid meet">`;

  // Horizontal grid (4 segments)
  for(let i = 0; i <= 4; i++){
    const y = M.top + (i/4) * innerH;
    s += `<line x1="${M.left}" y1="${y}" x2="${M.left+innerW}" y2="${y}" stroke="${i===4?'#bdb39d':'#e8dec9'}" stroke-width="${i===4?1:0.8}" ${i<4?'stroke-dasharray="2,3"':''} />`;
  }

  // Left Y axis labels (daily counts) — only if any daily-count metric is on
  if(state.attempts || state.due){
    for(let i = 0; i <= 4; i++){
      const v = Math.round(dailyMax * (4-i) / 4);
      const y = M.top + (i/4) * innerH;
      s += `<text x="${M.left-5}" y="${y+3.5}" text-anchor="end" font-size="${fs}" fill="#6b6e7c" font-family="JetBrains Mono,ui-monospace,monospace">${v}</text>`;
    }
  }

  // Right axes — cumulative inner (brick), accuracy outer (sage). When both on, two columns.
  const cumLabelX = M.left + innerW + 5;
  const accLabelX = (showCum && showAcc) ? M.left + innerW + (isMobile?42:50) : M.left + innerW + 5;
  if(showCum){
    for(let i = 0; i <= 4; i++){
      const v = Math.round(cumMax * (4-i) / 4);
      const y = M.top + (i/4) * innerH;
      s += `<text x="${cumLabelX}" y="${y+3.5}" text-anchor="start" font-size="${fs}" fill="#9a3a35" font-family="JetBrains Mono,ui-monospace,monospace">${v}</text>`;
    }
  }
  if(showAcc){
    for(let i = 0; i <= 4; i++){
      const v = (4-i) * 25;
      const y = M.top + (i/4) * innerH;
      s += `<text x="${accLabelX}" y="${y+3.5}" text-anchor="start" font-size="${fs}" fill="#3d5a40" font-family="JetBrains Mono,ui-monospace,monospace">${v}%</text>`;
    }
  }

  // X axis ticks (every 7 days + endpoints + today, with overlap protection)
  const xTickSet = new Set([xMin, xMax, 0]);
  for(let d = xMin; d <= xMax; d++){
    if(d % 7 === 0) xTickSet.add(d);
  }
  let sortedTicks = [...xTickSet].filter(d => d >= xMin && d <= xMax).sort((a,b)=>a-b);
  // Drop ticks that are too close (<4 days apart) to avoid label overlap
  const filtered = [];
  for(const t of sortedTicks){
    if(filtered.length === 0 || t - filtered[filtered.length-1] >= 4){
      filtered.push(t);
    }
  }
  if(!filtered.includes(0) && xMin <= 0 && 0 <= xMax) filtered.push(0);
  if(!filtered.includes(xMax)) filtered.push(xMax);
  filtered.sort((a,b)=>a-b);

  filtered.forEach(d => {
    const x = xScale(d) + dayW/2;
    s += `<line x1="${x}" y1="${M.top+innerH}" x2="${x}" y2="${M.top+innerH+3}" stroke="#bdb39d" />`;
    let label;
    if(d === 0) label = '今日';
    else {
      const dt = new Date();
      dt.setDate(dt.getDate() + d);
      label = (dt.getMonth()+1) + '/' + dt.getDate();
    }
    s += `<text x="${x}" y="${M.top+innerH+15}" text-anchor="middle" font-size="${fs}" fill="#6b6e7c" font-family="Noto Serif TC,serif">${label}</text>`;
  });

  // Today divider when future also shown
  if(hasFuture && hasPast){
    const x = xScale(0) + dayW/2;
    s += `<line x1="${x}" y1="${M.top}" x2="${x}" y2="${M.top+innerH}" stroke="#7d4d1a" stroke-width="1" stroke-dasharray="3,3" opacity="0.45" />`;
  }

  // Daily attempts bars (ochre)
  if(state.attempts){
    past.forEach(p => {
      if(p.attempted === 0) return;
      const x = xScale(p.offset) + dayW*0.18;
      const w = dayW * 0.64;
      const yT = y1(p.attempted);
      const h = (M.top+innerH) - yT;
      s += `<rect x="${x.toFixed(1)}" y="${yT.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#a86b2a" opacity="0.72" />`;
    });
  }

  // Future review bars (navy)
  if(state.due){
    future.forEach(f => {
      if(f.dueCount === 0) return;
      const x = xScale(f.offset) + dayW*0.18;
      const w = dayW * 0.64;
      const yT = y1(f.dueCount);
      const h = (M.top+innerH) - yT;
      s += `<rect x="${x.toFixed(1)}" y="${yT.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="#4a6b8c" opacity="0.7" />`;
    });
  }

  // Cumulative line (brick) — uses y3 with its own scale
  if(state.cumulative && cumPoints.length){
    const pts = cumPoints.map(p => [xScale(p.offset)+dayW/2, y3(p.value)]);
    s += `<polyline fill="none" stroke="#9a3a35" stroke-width="2" stroke-linejoin="round" points="${pts.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ')}" />`;
    const last = pts[pts.length-1];
    s += `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="#9a3a35" />`;
  }

  // Accuracy line (sage)
  if(state.accuracy){
    const pts = past
      .filter(p => p.attempted > 0)
      .map(p => [xScale(p.offset)+dayW/2, y2(100*p.correct/p.attempted)]);
    if(pts.length > 1){
      s += `<polyline fill="none" stroke="#3d5a40" stroke-width="2" stroke-linejoin="round" points="${pts.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ')}" />`;
    }
    pts.forEach(([x,y]) => s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="#3d5a40" />`);
  }

  s += '</svg>';
  return s;
}

/* ============================================================
   PRONUNCIATION
   ============================================================ */
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const accent = settings.speechAccent || 'en-US';
  u.lang = accent;
  u.rate = parseFloat(settings.speechRate)||0.85;
  u.pitch = 1;
  // Try to select the best available voice for the chosen accent
  const voices = window.speechSynthesis.getVoices();
  const accentRe = new RegExp(accent.replace('-','\\-'),'i');
  // Prefer Apple's high-quality voices, then Google, then any matching accent
  const pref = voices.find(v=>accentRe.test(v.lang) && /samantha|alex|daniel|karen|moira/i.test(v.name)) ||
               voices.find(v=>accentRe.test(v.lang) && /google/i.test(v.name)) ||
               voices.find(v=>accentRe.test(v.lang) && /natural|premium|enhanced/i.test(v.name)) ||
               voices.find(v=>accentRe.test(v.lang)) ||
               voices.find(v=>/^en/i.test(v.lang));
  if(pref) u.voice = pref;
  window.speechSynthesis.speak(u);
}
// Force voices to load on some browsers (Chrome quirk)
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{};
  window.speechSynthesis.getVoices();
}
// Speak the example sentence (slower) — used by sentence-listening button
function speakSentence(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = settings.speechAccent || 'en-US';
  u.rate = (parseFloat(settings.speechRate)||0.85) * 0.95; // slightly slower for sentences
  u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const accentRe = new RegExp((settings.speechAccent||'en-US').replace('-','\\-'),'i');
  const pref = voices.find(v=>accentRe.test(v.lang) && /samantha|alex|daniel|karen|moira/i.test(v.name)) ||
               voices.find(v=>accentRe.test(v.lang) && /google/i.test(v.name)) ||
               voices.find(v=>accentRe.test(v.lang)) ||
               voices.find(v=>/^en/i.test(v.lang));
  if(pref) u.voice = pref;
  window.speechSynthesis.speak(u);
}

function startRootSession(root){
  session = {mode:'root_specific', currentRoot:root, idx:0, total:settings.dailyTarget, correct:0, wrong:0, questions:[]};
  buildRootSpecificSession(root);
  renderQuestion();
}

function buildRootSpecificSession(root){
  // Practice all words with this specific root
  const rootWords = VOCAB.filter(v=>v.root===root);
  // If fewer words than daily target, cap total
  session.total = Math.min(session.total, rootWords.length);
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{
      v = rootWords[Math.floor(Math.random()*rootWords.length)];
      tries++;
    }while(used.has(v.w) && tries<30);
    used.add(v.w);
    // Mix: 50% cloze, 50% meaning-pick
    const r = Math.random();
    if(r < 0.5 && v.e){
      const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\w*\\b","i"),"___");
      const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
      // Distractors: prefer same-root words (they're confusingly close in meaning)
      const sameRoot = rootWords.filter(x=>x.w!==v.w);
      const distractors = [];
      for(const sr of shuffle(sameRoot.slice())){
        if(distractors.length>=2) break;
        distractors.push(sr.w);
      }
      // Fill with random from VOCAB if not enough
      while(distractors.length<3){
        const cand = VOCAB[Math.floor(Math.random()*VOCAB.length)];
        if(cand.w!==v.w && !distractors.includes(cand.w)) distractors.push(cand.w);
      }
      const opts = shuffle([v.w, ...distractors]);
      session.questions.push({type:'cloze', target:v, stem:finalStem, opts, ans:v.w});
    } else {
      const wrongVocab = shuffle(VOCAB.filter(x=>x.w!==v.w && x.z!==v.z)).slice(0,3);
      const opts = shuffle([v.z, ...wrongVocab.map(x=>x.z)]);
      session.questions.push({type:'meaning', target:v, opts, ans:v.z});
    }
  }
}

function buildRootRandomSession(){
  // Mix words from all roots, but ensure same-root distractors
  const rootWords = VOCAB.filter(v=>v.root);
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{
      v = rootWords[Math.floor(Math.random()*rootWords.length)];
      tries++;
    }while(used.has(v.w) && tries<30);
    used.add(v.w);
    if(v.e && Math.random()<0.5){
      const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\w*\\b","i"),"___");
      const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
      // Same-root distractors
      const sameRoot = VOCAB.filter(x=>x.root===v.root && x.w!==v.w);
      const distractors = shuffle(sameRoot.slice()).slice(0,2).map(x=>x.w);
      while(distractors.length<3){
        const cand = VOCAB[Math.floor(Math.random()*VOCAB.length)];
        if(cand.w!==v.w && !distractors.includes(cand.w)) distractors.push(cand.w);
      }
      const opts = shuffle([v.w, ...distractors]);
      session.questions.push({type:'cloze', target:v, stem:finalStem, opts, ans:v.w});
    } else {
      const wrongVocab = shuffle(VOCAB.filter(x=>x.w!==v.w && x.z!==v.z)).slice(0,3);
      const opts = shuffle([v.z, ...wrongVocab.map(x=>x.z)]);
      session.questions.push({type:'meaning', target:v, opts, ans:v.z});
    }
  }
}

function buildExamSession(){
  // Practice ONLY words that have a src tag (exam vocabulary)
  const examWords = VOCAB.filter(v=>v.src);
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{
      v = examWords[Math.floor(Math.random()*examWords.length)];
      tries++;
    }while(used.has(v.w) && tries<30);

    const r = Math.random();
    if(r < 0.6 && v.e){
      // Cloze
      const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\w*\\b","i"),"___");
      const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
      const distractors = pickDistractorsForWord(v, 3);
      const opts = shuffle([v.w, ...distractors]);

    } else {

      const wrongVocab = shuffle(VOCAB.filter(x=>x.w!==v.w && x.z!==v.z)).slice(0,3);

function pickWeightedDueWord(){
  // Prefer words with low accuracy or due for review
  const now = Date.now();
  const candidates = VOCAB.map(v=>{
    const s = store.wordStats[v.w] || {seen:0,correct:0,wrong:0,dueAt:0};
    let weight = 1;
    if(s.seen===0) weight = 3; // new words
    else {
      const acc = s.correct/(s.seen||1);
      weight = 1 + (1-acc)*4;
      if(s.dueAt && s.dueAt < now) weight *= 2;
    }
    return {v, weight};
  });
  const total = candidates.reduce((a,b)=>a+b.weight,0);
  let r = Math.random()*total;
  for(const c of candidates){
    r -= c.weight;
    if(r<=0) return c.v;
  }
  return candidates[0].v;
}

function buildClozeSession(){
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{ v = pickWeightedDueWord(); tries++; }while(used.has(v.w) && tries<30);
    used.add(v.w);
    // Build question: sentence with the word blanked
    const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\b","i"),"___");
    // If the exact word doesn't appear, try common inflections
    const finalStem = stem === v.e ? maskInflection(v.e, v.w) : stem;
    const distractors = pickDistractorsForWord(v, 3);
    const opts = shuffle([v.w, ...distractors]);
    session.questions.push({type:'cloze', target:v, stem:finalStem, opts, ans:v.w});
  }
}

function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

// If example uses an inflected form (e.g., "abided" for "abide"),
// mask the longest matching variant.
function maskInflection(text, base){
  // Irregular verb forms - manually handle common ones
  const IRREGULAR = {
    "slay":["slain","slew","slaying"],
    "withdraw":["withdrew","withdrawn","withdrawing"],
    "behold":["beheld","beholding"],
    "weigh":["weighed","weighing"],
    "thaw":["thawed","thawing"],
    "draft":["drafted","drafting"],
    "grind":["ground","grinding"],
    "gnash":["gnashed","gnashing"]
  };
  const variants = [base, base+'s', base+'es', base+'ed', base+'d', base+'ing',
                    base.replace(/e$/,'')+'ing', base.replace(/y$/,'ies'),
                    base.replace(/y$/,'ied')];
  if(IRREGULAR[base]) variants.push(...IRREGULAR[base]);
  variants.sort((a,b)=>b.length-a.length);
  for(const v of variants){
    const re = new RegExp("\\b"+escapeReg(v)+"\\b","i");
    if(re.test(text)) return text.replace(re, "___");
  }
  return text + " (___)";
}

function pickDistractorsForWord(target, n){
  const out = [];
  // Prefer words with same first letter or POS, or confused-pair partner
  const pool = VOCAB.filter(v=>v.w!==target.w);
  const shuffled = shuffle(pool.slice());
  // 1) Add confused partner if exists
  if(target.c){
    const partner = VOCAB.find(v=>v.w===target.c);
    if(partner) out.push(partner.w);
  }
  // 2) Same first letter
  for(const v of shuffled){
    if(out.length>=n) break;
    if(out.includes(v.w)) continue;
    if(v.w[0].toLowerCase()===target.w[0].toLowerCase()) out.push(v.w);
  }
  // 3) Same POS
  for(const v of shuffled){
    if(out.length>=n) break;
    if(out.includes(v.w)) continue;
    if(v.p===target.p) out.push(v.w);
  }
  // 4) Random
  for(const v of shuffled){
    if(out.length>=n) break;
    if(!out.includes(v.w)) out.push(v.w);
  }
  return out.slice(0,n);
}

function buildPassageSession(){
  const passages = shuffle(PASSAGES.slice()).slice(0, Math.min(PASSAGES.length, Math.max(2, Math.ceil(session.total/5))));
  session.total = passages.length;
  passages.forEach(p=>{
    session.questions.push({type:'passage', passage:p});
  });
}

function buildSynAntSession(){
  // Use words that have either s (synonym) or a (antonym)
  const candidates = VOCAB.filter(v=>v.s||v.a);
  const picked = shuffle(candidates).slice(0, session.total);
  session.total = picked.length;
  picked.forEach(v=>{
    const wantSyn = v.s && (!v.a || Math.random()<0.5);
    const ans = wantSyn ? v.s : v.a;
    const distractors = pickSynAntDistractors(v, ans, 3);
    const opts = shuffle([ans, ...distractors]);
    session.questions.push({type:'synant', target:v, mode:wantSyn?'syn':'ant', opts, ans});
  });
}

function pickSynAntDistractors(target, ans, n){
  // Pick from VOCAB and from other words' s/a fields, avoiding answer and target
  const allCandidates = new Set();
  VOCAB.forEach(v=>{
    if(v.w!==target.w && v.w!==ans) allCandidates.add(v.w);
    if(v.s && v.s!==ans && v.s!==target.w) allCandidates.add(v.s);
    if(v.a && v.a!==ans && v.a!==target.w) allCandidates.add(v.a);
  });
  return shuffle(Array.from(allCandidates)).slice(0,n);
}

function buildConfusedSession(){
  const pairKeys = Object.keys(CONFUSED_NOTES);
  const expanded = [];
  pairKeys.forEach(k=>{
    const [a,b] = k.split('|');
    const va = VOCAB.find(v=>v.w===a);
    const vb = VOCAB.find(v=>v.w===b);
    if(va) expanded.push({target:va, partner:vb||{w:b,z:'',e:''}, key:k});
    if(vb) expanded.push({target:vb, partner:va||{w:a,z:'',e:''}, key:k});
  });
  const picked = shuffle(expanded).slice(0, session.total);
  session.total = picked.length;
  picked.forEach(item=>{
    const v = item.target;
    const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\b","i"),"___");
    const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
    // Options: target word, partner word, plus 2 distractors
    const partnerW = item.partner.w;
    const extras = pickDistractorsForWord(v, 2).filter(x=>x!==partnerW).slice(0,2);
    while(extras.length<2){
      const r = VOCAB[Math.floor(Math.random()*VOCAB.length)].w;
      if(r!==v.w && r!==partnerW && !extras.includes(r)) extras.push(r);
    }
    const opts = shuffle([v.w, partnerW, ...extras]);
    session.questions.push({type:'confused', target:v, stem:finalStem, opts, ans:v.w, key:item.key, partner:item.partner});
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

  const q = session.questions[session.idx];

}

  const listenText = p.text.replace(/\[\[\d+\]\]/g, 'blank');
  // Render each blank's options below
  app.innerHTML = `
    <div class="practice">
      ${renderPHead('段落填空 · Passage Cloze')}
      <div class="q-prompt"><strong style="font-style:italic;font-family:var(--serif);font-size:16px">${p.title}</strong> <button class="speak-btn-mini" onclick="speakSentence(\`${listenText.replace(/`/g,"'").replace(/'/g,"\\'")}\`)" title="聽全文（空格處唸 blank）">▶ 聽全文</button></div>
      <div class="q-stem passage" id="passageText">${html}</div>
      <div id="passageBlanks"></div>
      <div class="feedback" id="fb"></div>
      <div class="actions hidden" id="actions">
        <button class="btn ghost" onclick="quitSession()">結束</button>
        <button class="btn" onclick="nextQ()">下一段 →</button>
      </div>
    </div>
  `;
  renderPassageBlanks(q, 0);
}

function renderPassageBlanks(q, currentIdx){
  const p = q.passage;
  const wrap = document.getElementById('passageBlanks');
  if(!q.userAnswers) q.userAnswers = {};
  if(currentIdx >= p.blanks.length){
    // All answered, show final feedback
    return finishPassage(q);
  }
  const b = p.blanks[currentIdx];
  // Highlight current blank
  document.querySelectorAll('#passageText .blank').forEach(el=>{
    el.style.background = '';
    el.style.color = '';
  });
  const cur = document.getElementById('b'+b.idx);
  if(cur){
    cur.style.background='rgba(168,107,42,.18)';
    cur.style.color='var(--ochre-deep)';
    cur.scrollIntoView({behavior:'smooth',block:'center'});
  }
  wrap.innerHTML = `
    <div class="q-prompt" style="margin-top:14px">空格 ⟪${b.idx}⟫ — 共 ${p.blanks.length} 格中的第 ${currentIdx+1} 格</div>
    <div class="opts" id="optsBox">
      ${shuffle(b.pool.slice()).map((o,i)=>`<button class="opt" data-w="${o}" onclick="answerPassageBlank('${o}',${currentIdx})">
        <span class="letter">${"ABCD"[i]}</span><span class="word">${o}</span>
      </button>`).join('')}
    </div>
  `;
}

function answerPassageBlank(choice, blankIdx){
  const q = session.questions[session.idx];
  const p = q.passage;
  const b = p.blanks[blankIdx];
  q.userAnswers[b.idx] = choice;
  const isCorrect = choice === b.ans;
  // Update DOM blank
  const cur = document.getElementById('b'+b.idx);
  if(cur){
    cur.textContent = choice;
    cur.classList.add('filled');
    cur.style.background='';
    if(!isCorrect){
      cur.classList.add('wrong');
      cur.title = '正解: ' + b.ans;
    }
  }
  // Mark options
  document.querySelectorAll('#optsBox .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.w === b.ans) btn.classList.add('correct');
    else if(btn.dataset.w === choice && !isCorrect) btn.classList.add('wrong');
  });
  // Record stat against the answer's word if it exists in vocab
  const targetVocab = VOCAB.find(v=>v.w===b.ans);
  if(targetVocab) recordResult(b.ans, isCorrect);
  bumpToday(isCorrect);
  if(isCorrect) session.correct++; else session.wrong++;
  // Auto-speak the correct answer
  if(parseInt(settings.autoSpeak)){
    setTimeout(()=>speak(b.ans), 200);
  }
  setTimeout(()=>renderPassageBlanks(q, blankIdx+1), 900);
}

function finishPassage(q){
  const p = q.passage;
  const wrap = document.getElementById('passageBlanks');
  let correctCount = 0;
  p.blanks.forEach(b=>{ if(q.userAnswers[b.idx]===b.ans) correctCount++; });
  // Show all correct answers in passage
  document.querySelectorAll('#passageText .blank').forEach(el=>{
    el.style.background='';
  });
  wrap.innerHTML = `
    <div class="feedback ${correctCount===p.blanks.length?'ok':'ng'} show" style="display:block">
      <div class="fb-tag">${correctCount===p.blanks.length?'全對 ✓':'答對 '+correctCount+' / '+p.blanks.length}</div>
      <div style="line-height:2">各空格正解：${p.blanks.map(b=>`<span class="ans-word">${b.ans}</span><button class="speak-btn-mini" onclick="speak('${b.ans.replace(/'/g,"\\'")}')" title="聽發音">▶</button>`).join('　')}</div>
      <div style="margin-top:10px"><button class="speak-btn-mini" onclick="speakSentence(\`${p.text.replace(/\[\[\d+\]\]/g, (m)=>{const idx=parseInt(m.match(/\d+/)[0]); const b=p.blanks.find(x=>x.idx===idx); return b?b.ans:'___';}).replace(/`/g,"'")}\`)" title="聽全文">▶</button> 聽全文朗讀</div>
    </div>
  `;
  document.getElementById('actions').classList.remove('hidden');
}

function renderPHead(title){
  return `<div class="p-head">
    <div class="p-mode">${title}</div>
    <div class="p-prog">${session.idx+1} / ${session.total}</div>
    <button class="p-close" onclick="quitSession()" title="返回">✕</button>
  </div>`;
}

function answer(choice){
  const q = session.questions[session.idx];
  const isCorrect = choice === q.ans;
  // Lock options
  document.querySelectorAll('#optsBox .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.w === q.ans) btn.classList.add('correct');
    else if(btn.dataset.w === choice && !isCorrect) btn.classList.add('wrong');
  });
  // Update blank in stem
  const slot = document.getElementById('blankSlot');
  if(slot){
    slot.textContent = choice;
    slot.classList.add('filled');
    if(!isCorrect) slot.classList.add('wrong');
  }
  // Build feedback
  const fb = document.getElementById('fb');
  const target = q.target;
  const ansVocab = VOCAB.find(v=>v.w===q.ans) || target;
  let html = '';
  if(isCorrect){
    html += `<div class="fb-tag">正確 · Correct</div>`;
    html += `<div><span class="ans-word">${q.ans}</span> <button class="speak-btn-mini" onclick="speak('${q.ans.replace(/'/g,"\\'")}')" title="再聽一次">▶</button> · <span class="ans-zh">${ansVocab.z||''}</span></div>`;
  }else{
    html += `<div class="fb-tag">再想想 · Review</div>`;
    html += `<div>正解：<span class="ans-word">${q.ans}</span> <button class="speak-btn-mini" onclick="speak('${q.ans.replace(/'/g,"\\'")}')" title="聽發音">▶</button> · <span class="ans-zh">${ansVocab.z||''}</span></div>`;
  }
  // Add example sentence with target highlighted + a sentence-speak button
  if(ansVocab && ansVocab.e){
    const re = new RegExp("\\b("+escapeReg(ansVocab.w)+"\\w*)\\b","i");
    const safeE = ansVocab.e.replace(/'/g,"\\'").replace(/"/g,"&quot;");
    html += `<div class="ex">${ansVocab.e.replace(re,"<u>$1</u>")} <button class="speak-btn-mini" onclick="speakSentence(\`${ansVocab.e.replace(/`/g,"'")}\`)" title="聽整句">▶</button></div>`;
  }
  // Show exam source tag if applicable
  if(ansVocab && ansVocab.src){
    html += `<div class="src-tag">📋 曾出現於 ${ansVocab.src.split('/').join('、')}</div>`;
  }
  // Show root tag if applicable
  if(ansVocab && ansVocab.root){
    html += `<div class="root-tag">🌱 字根：<em>${ansVocab.root}-</em></div>`;
  }
  // For confused-mode, add the comparison note
  if(q.type==='confused' && q.key && CONFUSED_NOTES[q.key]){
    html += `<div class="conf-note">${CONFUSED_NOTES[q.key]}</div>`;
  }
  // For synant, briefly explain
  if(q.type==='synant'){
    const partnerVocab = VOCAB.find(v=>v.w===q.ans);
    if(partnerVocab && partnerVocab.z){
      html += `<div class="conf-note">${q.mode==='syn'?'同義字':'反義字'} <span class="ans-word">${q.ans}</span> 意為 ${partnerVocab.z}</div>`;
    }
  }
  fb.innerHTML = html;
  fb.classList.add('show', isCorrect?'ok':'ng');
  document.getElementById('actions').classList.remove('hidden');
  recordResult(target.w, isCorrect);
  bumpToday(isCorrect);
  if(isCorrect) session.correct++; else session.wrong++;
  // Auto-speak the correct answer
  if(parseInt(settings.autoSpeak)){
    setTimeout(()=>speak(q.ans), 350);
  }
}

function nextQ(){
  session.idx++;
  renderQuestion();
}

function renderDone(){
  const acc = session.correct + session.wrong > 0
    ? Math.round(100*session.correct/(session.correct+session.wrong)) : 0;
  let msg = '';
  if(acc>=90) msg = '表現優異，繼續保持。';
  else if(acc>=70) msg = '熟練度穩定。可重複練習答錯的字加強鞏固。';
  else if(acc>=50) msg = '已掌握部分字彙，建議檢視「需要加強的字」清單。';
  else msg = '別氣餒，這些字本來就難。從錯題回頭看例句，會記得更牢。';
  document.getElementById('app').innerHTML = `
    <header class="masthead">
      <div class="eyebrow">SESSION COMPLETE</div>
      <h1 class="title">這次練習結束<span class="cn">本回合結果</span></h1>
    </header>
    <div class="done">
      <div class="big-num">${session.correct}<span class="slash"> / </span>${session.correct+session.wrong}</div>
      <div class="ratio-l">正確率 ${acc}%</div>
      <div class="msg">${msg}</div>
      <div class="actions">
        <button class="btn ghost" onclick="renderHome()">回到首頁</button>
        <button class="btn" onclick="startMode('${session.mode}')">再來一回 →</button>
      </div>
    </div>
  `;
  session = null;
}

function quitSession(){
  if(session && session.idx>0){
    if(!confirm('要結束目前練習回到首頁嗎？')) return;
  }
  session = null;
  renderHome();
}

/* ============================================================
   SETTINGS
   ============================================================ */
function openSettings(){
  document.getElementById('setDaily').value = settings.dailyTarget;
  document.getElementById('setRate').value = settings.speechRate;
  document.getElementById('setAutoSpeak').value = settings.autoSpeak;
  document.getElementById('setAccent').value = settings.speechAccent || 'en-US';
  document.getElementById('settingsModal').classList.add('show');
}
function testVoice(){
  // Apply current selections temporarily so the test reflects what user just chose
  settings.speechRate = parseFloat(document.getElementById('setRate').value)||0.85;
  settings.speechAccent = document.getElementById('setAccent').value || 'en-US';
  speak('infrastructure');
}
function closeSettings(){
  settings.dailyTarget = Math.min(100, Math.max(5, parseInt(document.getElementById('setDaily').value)||20));
  settings.speechRate = parseFloat(document.getElementById('setRate').value)||0.85;
  settings.autoSpeak = parseInt(document.getElementById('setAutoSpeak').value)||0;
  settings.speechAccent = document.getElementById('setAccent').value || 'en-US';
  saveSettings(settings);
  document.getElementById('settingsModal').classList.remove('show');
  renderHome();
}
function resetAll(){
  if(!confirm('確定要清除所有學習進度？此動作無法復原。')) return;
  localStorage.removeItem(STORE_KEY);
  store = loadStore();
  document.getElementById('settingsModal').classList.remove('show');
  renderHome();
}
function exportProgress(){
  const data = JSON.stringify({store, settings, exportedAt:new Date().toISOString()}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '後中醫單字學習進度_'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importProgress(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(d.store) {store = d.store; saveStore(store);}
        if(d.settings) {settings = Object.assign({},DEFAULT_SETTINGS,d.settings); saveSettings(settings);}
        alert('進度匯入成功');
        renderHome();
      }catch(err){ alert('檔案格式錯誤：'+err.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

/* Boot */
renderHome();
</script>
