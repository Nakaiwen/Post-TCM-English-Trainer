<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>後中醫英文單字練習器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+TC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6efe2;
  --bg-soft:#efe5d2;
  --paper:#fdfaf2;
  --ink:#1a1d2a;
  --ink-soft:#3d4252;
  --ink-mute:#6b6e7c;
  --ochre:#a86b2a;
  --ochre-deep:#7d4d1a;
  --sage:#3d5a40;
  --sage-soft:#5b7a5e;
  --brick:#9a3a35;
  --line:#d8cdb6;
  --line-soft:#e8dec9;
  --shadow:0 1px 0 #e3d8bf, 0 8px 24px -12px rgba(60,40,10,.18);
  --serif:'Newsreader','Noto Serif TC',serif;
  --cn:'Noto Serif TC',serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif);
  background:var(--bg);
  color:var(--ink);
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 10%,rgba(168,107,42,.06),transparent 40%),
    radial-gradient(circle at 85% 90%,rgba(61,90,64,.05),transparent 40%);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
.app{max-width:780px;margin:0 auto;padding:24px 20px 60px}
header.masthead{
  border-bottom:1px solid var(--line);
  padding:8px 0 22px;
  margin-bottom:28px;
  position:relative;
}
.eyebrow{
  font-family:var(--cn);
  font-size:11.5px;
  letter-spacing:.32em;
  color:var(--ochre);
  text-transform:uppercase;
  font-weight:500;
  margin-bottom:6px;
}
h1.title{
  font-family:var(--serif);
  font-size:34px;
  font-weight:500;
  letter-spacing:-.01em;
  line-height:1.1;
}
h1.title .cn{
  font-family:var(--cn);
  font-weight:500;
  font-size:.78em;
  margin-left:8px;
  color:var(--ink-soft);
}
.sub{
  font-family:var(--cn);
  font-size:13.5px;
  color:var(--ink-mute);
  margin-top:8px;
  letter-spacing:.04em;
}

/* --- Stat strip --- */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:28px;
  font-family:var(--cn);
}
.stat{
  background:var(--paper);
  padding:12px 10px;
  text-align:center;
}
.stat .n{
  font-family:var(--serif);
  font-size:24px;
  font-weight:500;
  color:var(--ink);
  line-height:1;
}
.stat .l{
  font-size:10.5px;
  color:var(--ink-mute);
  letter-spacing:.18em;
  margin-top:6px;
  text-transform:uppercase;
}

/* --- Mode cards --- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:36px}
.mode{
  background:var(--paper);
  border:1px solid var(--line);
  padding:18px 16px 16px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  font:inherit;
  color:inherit;
  display:block;
  position:relative;
  overflow:hidden;
}
.mode::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,transparent 60%,rgba(168,107,42,.06));
  opacity:0;
  transition:opacity .2s;
}
.mode:hover{border-color:var(--ochre);transform:translateY(-1px);box-shadow:var(--shadow)}
.mode:hover::before{opacity:1}
.mode .num{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ochre);
  letter-spacing:.1em;
  display:block;
  margin-bottom:8px;
}
.mode .t{
  font-family:var(--cn);
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  margin-bottom:4px;
  line-height:1.3;
}
.mode .t-en{
  font-style:italic;
  font-size:14px;
  color:var(--ink-soft);
  margin-bottom:10px;
}
.mode .d{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  line-height:1.5;
}

/* --- Section heading --- */
.sec-h{
  font-family:var(--cn);
  font-size:11.5px;
  letter-spacing:.3em;
  color:var(--ochre);
  text-transform:uppercase;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:baseline;
}
.sec-h .right{
  font-size:11px;
  color:var(--ink-mute);
  letter-spacing:.1em;
  text-transform:none;
}

/* --- Practice screen --- */
.practice{
  background:var(--paper);
  border:1px solid var(--line);
  padding:24px 22px 20px;
  margin-bottom:18px;
  position:relative;
}
.p-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line-soft);
}
.p-mode{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ochre);
  letter-spacing:.15em;
  text-transform:uppercase;
}
.p-prog{
  font-family:var(--mono);
  font-size:12px;
  color:var(--ink-mute);
}
.p-close{
  background:none;border:none;
  font-family:var(--serif);
  font-size:18px;
  color:var(--ink-mute);
  cursor:pointer;
  padding:4px 10px;
}
.p-close:hover{color:var(--ink)}

.q-prompt{
  font-family:var(--cn);
  font-size:13px;
  color:var(--ink-mute);
  margin-bottom:14px;
  letter-spacing:.05em;
}
.q-stem{
  font-family:var(--serif);
  font-size:20px;
  line-height:1.6;
  color:var(--ink);
  margin-bottom:24px;
}
.q-stem.passage{font-size:18px;line-height:1.75}
.q-stem .blank{
  display:inline-block;
  min-width:90px;
  border-bottom:2px solid var(--ochre);
  padding:0 6px;
  margin:0 2px;
  font-family:var(--mono);
  font-size:.92em;
  color:var(--ochre);
  text-align:center;
}
.q-stem .blank.filled{
  color:var(--sage);
  border-bottom-color:var(--sage);
}
.q-stem .blank.wrong{
  color:var(--brick);
  border-bottom-color:var(--brick);
}

.q-target{
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
  font-size:34px;
  color:var(--ink);
  text-align:center;
  margin:8px 0 6px;
  letter-spacing:-.01em;
}
.q-target-pos{
  text-align:center;
  font-family:var(--mono);
  font-size:11.5px;
  color:var(--ochre);
  letter-spacing:.15em;
  margin-bottom:22px;
}
.q-target-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin:8px 0 6px;
}
.speak-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--ochre);
  width:38px;height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:14px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:all .15s;
  flex-shrink:0;
}
.speak-btn:hover{background:var(--bg-soft);border-color:var(--ochre)}
.speak-btn:active{transform:scale(.95)}

/* --- Options --- */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.opt{
  background:var(--bg-soft);
  border:1px solid var(--line);
  padding:13px 16px;
  font-family:var(--serif);
  font-size:17px;
  color:var(--ink);
  text-align:left;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  align-items:center;
  gap:12px;
  font:inherit;
  width:100%;
}
.opt:hover:not(:disabled){border-color:var(--ochre);background:#f3e8d0}
.opt:disabled{cursor:default}
.opt .letter{
  font-family:var(--mono);
  font-size:11px;
  color:var(--ochre);
  letter-spacing:.1em;
  width:18px;
  flex-shrink:0;
}
.opt .word{flex:1;font-style:italic;font-weight:500}
.opt .word.plain{font-style:normal;font-weight:400}
.opt.correct{
  background:#e6efdc;
  border-color:var(--sage);
  color:var(--sage);
}
.opt.correct .letter{color:var(--sage)}
.opt.wrong{
  background:#f3dcd8;
  border-color:var(--brick);
  color:var(--brick);
}
.opt.wrong .letter{color:var(--brick)}

/* --- Listen mode UI --- */
.listen-area{
  text-align:center;
  padding:18px 0 8px;
}
.listen-big{
  width:78px;height:78px;
  border-radius:50%;
  border:1.5px solid var(--ochre);
  background:var(--paper);
  color:var(--ochre);
  font-size:28px;
  cursor:pointer;
  margin-bottom:12px;
  transition:all .15s;
}
.listen-big:hover{background:var(--bg-soft)}
.listen-big:active{transform:scale(.95)}
.listen-hint{
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  margin-bottom:18px;
  letter-spacing:.05em;
}

/* --- Feedback --- */
.feedback{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid var(--line);
  background:var(--bg-soft);
  font-family:var(--cn);
  font-size:14px;
  color:var(--ink-soft);
  line-height:1.65;
  display:none;
}
.feedback.show{display:block}
.feedback .fb-tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase;
  margin-bottom:6px;
}
.feedback.ok .fb-tag{color:var(--sage)}
.feedback.ng .fb-tag{color:var(--brick)}
.feedback .ans-word{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  color:var(--ochre-deep);
}
.feedback .ans-zh{font-weight:500;color:var(--ink)}
.feedback .ex{
  margin-top:8px;
  font-style:italic;
  font-family:var(--serif);
  color:var(--ink-soft);
  font-size:14.5px;
  line-height:1.5;
}
.feedback .ex u{
  text-decoration:none;
  background:linear-gradient(transparent 60%,rgba(168,107,42,.25) 0);
  padding:0 2px;
}
.feedback .src-tag{
  margin-top:10px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ochre-deep);
  letter-spacing:.05em;
}
.feedback .conf-note{
  margin-top:10px;
  padding-top:10px;
  border-top:1px dashed var(--line);
  font-size:13px;
}

/* --- Footer actions --- */
.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.btn{
  flex:1;
  padding:13px 18px;
  font-family:var(--cn);
  font-size:14.5px;
  font-weight:500;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
  letter-spacing:.05em;
  transition:all .15s;
}
.btn:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--bg-soft);border-color:var(--ink-soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* --- Recent words / weak words --- */
.weak-list{
  background:var(--paper);
  border:1px solid var(--line);
  padding:18px 20px;
  margin-bottom:18px;
}
.weak-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px dotted var(--line-soft);
  font-size:15px;
  align-items:center;
  gap:12px;
}
.weak-row:last-child{border-bottom:none}
.weak-row .ww{
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
}
.weak-row .wzh{font-family:var(--cn);font-size:13px;color:var(--ink-soft);flex:1;text-align:right}
.weak-row .wstat{font-family:var(--mono);font-size:11px;color:var(--brick);min-width:40px;text-align:right}
.weak-empty{font-family:var(--cn);font-size:13px;color:var(--ink-mute);text-align:center;padding:14px 0}

/* --- Settings --- */
.settings-bar{
  display:flex;
  gap:8px;
  font-family:var(--cn);
  font-size:12.5px;
  color:var(--ink-mute);
  margin-bottom:18px;
  flex-wrap:wrap;
}
.settings-bar .s-link{
  cursor:pointer;
  border-bottom:1px dotted var(--ink-mute);
  letter-spacing:.05em;
}
.settings-bar .s-link:hover{color:var(--ochre);border-color:var(--ochre)}

.modal-bg{
  position:fixed;inset:0;
  background:rgba(26,29,42,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--paper);
  border:1px solid var(--ink);
  max-width:440px;
  width:100%;
  padding:26px 24px 22px;
  max-height:85vh;
  overflow-y:auto;
}
.modal h3{
  font-family:var(--serif);
  font-weight:500;
  font-size:22px;
  margin-bottom:18px;
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
}
.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  font-family:var(--cn);
  font-size:14px;
  border-bottom:1px dotted var(--line-soft);
  gap:12px;
}
.setting-row:last-of-type{border-bottom:none}
.setting-row label{flex:1}
.setting-row select,.setting-row input[type=number]{
  font-family:var(--serif);
  font-size:14px;
  padding:6px 10px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  min-width:90px;
}
.setting-row .danger{color:var(--brick);border-color:var(--brick);background:transparent;padding:6px 12px;cursor:pointer;font-family:var(--cn);font-size:13px}

/* --- Done screen --- */
.done{
  background:var(--paper);
  border:1px solid var(--line);
  padding:30px 24px;
  text-align:center;
}
.done .big-num{
  font-family:var(--serif);
  font-size:64px;
  font-weight:300;
  color:var(--ochre);
  line-height:1;
  margin-bottom:8px;
}
.done .big-num .slash{color:var(--ink-mute);font-size:.6em;font-weight:300}
.done .ratio-l{
  font-family:var(--cn);
  font-size:13px;
  color:var(--ink-mute);
  letter-spacing:.2em;
  margin-bottom:24px;
}
.done .msg{
  font-family:var(--cn);
  font-size:15px;
  color:var(--ink-soft);
  margin-bottom:24px;
  line-height:1.7;
}

/* --- Mobile --- */
@media (max-width:520px){
  body{font-size:16px}
  .app{padding:18px 14px 50px}
  h1.title{font-size:26px}
  h1.title .cn{display:block;margin-left:0;margin-top:4px;font-size:.65em}
  .stats{grid-template-columns:repeat(2,1fr)}
  .modes{grid-template-columns:1fr;gap:10px}
  .practice{padding:18px 16px 16px}
  .q-stem{font-size:18px}
  .q-stem.passage{font-size:16.5px}
  .q-target{font-size:28px}
  .opt{font-size:15.5px;padding:12px 14px}
  .actions{flex-direction:column;gap:8px}
}

/* --- Misc --- */
.tag-confused{
  display:inline-block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.1em;
  background:var(--ochre);
  color:var(--paper);
  padding:2px 8px;
  margin-left:8px;
  vertical-align:middle;
  text-transform:uppercase;
}
.derived-list{
  margin-top:6px;
  font-size:13.5px;
  color:var(--ink-mute);
  font-family:var(--cn);
}
.derived-list em{font-family:var(--serif);font-style:italic;color:var(--ink-soft)}

footer.foot{
  margin-top:40px;
  padding-top:18px;
  border-top:1px solid var(--line);
  font-family:var(--cn);
  font-size:11.5px;
  color:var(--ink-mute);
  text-align:center;
  letter-spacing:.1em;
  line-height:1.7;
}
footer.foot em{font-style:normal;color:var(--ochre)}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- Settings Modal -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h3>設定 · Settings</h3>
    <div class="setting-row">
      <label>每日題數</label>
      <input type="number" id="setDaily" min="5" max="100" step="5">
    </div>
    <div class="setting-row">
      <label>發音語速</label>
      <select id="setRate">
        <option value="0.7">慢 (0.7×)</option>
        <option value="0.85">適中 (0.85×)</option>
        <option value="1.0">標準 (1.0×)</option>
      </select>
    </div>
    <div class="setting-row">
      <label>每題完成後自動讀音</label>
      <select id="setAutoSpeak">
        <option value="1">開啟</option>
        <option value="0">關閉</option>
      </select>
    </div>
    <div class="setting-row">
      <label>清除所有學習進度</label>
      <button class="danger" onclick="resetAll()">重置</button>
    </div>
    <div style="margin-top:18px;text-align:right">
      <button class="btn" style="flex:none;padding:9px 22px" onclick="closeSettings()">關閉</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   後中醫英文單字練習器
   Vocabulary data extracted from cram-school handout (頁262-312)
   ============================================================ */

/* Each entry: w=word, p=pos, z=Chinese, e=example sentence,
   d=derived [{w,p,z}], s=synonym(s), a=antonym(s), c=confused-with-key */
const VOCAB = [
{w:"abdominals",p:"n.",z:"腹肌",e:"This exercise strengthens your abdominals.",d:[{w:"abdominal",p:"a.",z:"腹部的"},{w:"abdomen",p:"n.",z:"下腹，腹部"}]},
{w:"abide",p:"v.",z:"居住；遵守",e:"Competitors must abide by the rules.",d:[{w:"abidance",p:"n.",z:"居住，遵守"},{w:"abiding",p:"a.",z:"永久的，不變的"}]},
{w:"additive",p:"n.",z:"添加劑",e:"This snack is full of additives — just look at the label!"},
{w:"adolescent",p:"n./a.",z:"青少年（的）",e:"Parents often fail to understand the emotional problems of their adolescent kids.",d:[{w:"adolescence",p:"n.",z:"青春期"}]},
{w:"aftermath",p:"n.",z:"後果，餘波",e:"We all worked together in the aftermath of the earthquake.",s:"consequence"},
{w:"ailment",p:"n.",z:"小病痛",e:"I can still work, minor ailments notwithstanding.",d:[{w:"ail",p:"v.",z:"感到不適，使痛苦"}]},
{w:"ajar",p:"a.",z:"半開的",e:"We left the door ajar so that we could hear what they were saying."},
{w:"akin",p:"a.",z:"同類的，近似的",e:"Such behavior is akin to treachery.",d:[{w:"kin",p:"n.",z:"親人"}]},
{w:"allow",p:"v.",z:"允許",e:"Smoking is now allowed in this restaurant.",d:[{w:"allowance",p:"n.",z:"允許，津貼"},{w:"disallow",p:"v.",z:"不允許"}]},
{w:"altitude",p:"n.",z:"高度，海拔",e:"Thin air in high altitudes may cause Acute Mountain Sickness."},
{w:"amass",p:"v.",z:"積聚，累積",e:"She has amassed a huge fortune from her novels.",s:"accumulate",d:[{w:"mass",p:"n.",z:"質量，堆，團"},{w:"amassment",p:"n.",z:"積聚，堆積"}]},
{w:"amble",p:"v./n.",z:"漫步，散步",e:"Tourists ambled down the avenue, looking for souvenirs to buy.",s:"stroll"},
{w:"anguish",p:"n./v.",z:"痛苦，苦惱",e:"The injuries were painful but the mental anguish worse.",d:[{w:"anxious",p:"a.",z:"焦慮的"},{w:"anguished",p:"a.",z:"痛苦的"}]},

const STORE_KEY = "hzy_vocab_v1";
const SETTINGS_KEY = "hzy_vocab_settings_v1";
function loadStore(){
  try{const r=localStorage.getItem(STORE_KEY);if(r)return JSON.parse(r)}catch(e){}
  return {wordStats:{},sessions:[]};
}
function saveStore(s){try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch(e){}}
function loadSettings(){
  try{const r=localStorage.getItem(SETTINGS_KEY);if(r)return Object.assign({},DEFAULT_SETTINGS,JSON.parse(r))}catch(e){}
  return Object.assign({},DEFAULT_SETTINGS);
}
function saveSettings(s){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}catch(e){}}
const DEFAULT_SETTINGS = {dailyTarget:20,speechRate:0.85,autoSpeak:1};

let store = loadStore();
let settings = loadSettings();

/* per-word stats: {seen, correct, wrong, lastSeen, dueAt} */
function getStat(w){
  if(!store.wordStats[w]) store.wordStats[w]={seen:0,correct:0,wrong:0,lastSeen:0,dueAt:0};
  return store.wordStats[w];
}
function recordResult(w, isCorrect){
  const st = getStat(w);
  st.seen++;
  if(isCorrect) st.correct++; else st.wrong++;
  st.lastSeen = Date.now();
  // simple spaced-repetition: correct → push out further; wrong → review soon
  const now = Date.now();
  const day = 86400000;
  if(isCorrect){
    const streak = Math.max(0, st.correct - st.wrong);
    const interval = [1,2,4,7,15,30,60][Math.min(streak,6)] || 60;
    st.dueAt = now + interval*day;
  }else{
    st.dueAt = now + 0.5*day;
  }
  saveStore(store);
}

/* ============================================================
   TODAY SESSION TRACKER
   ============================================================ */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function getTodaySession(){
  let t = store.sessions.find(s=>s.date===todayKey());
  if(!t){t={date:todayKey(),attempted:0,correct:0};store.sessions.push(t);saveStore(store)}
  return t;
}
function bumpToday(isCorrect){
  const t=getTodaySession();
  t.attempted++;
  if(isCorrect)t.correct++;
  saveStore(store);
}

/* ============================================================
   PRONUNCIATION
   ============================================================ */
function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = parseFloat(settings.speechRate)||0.85;
  // Try to select a clear English voice
  const voices = window.speechSynthesis.getVoices();
  const pref = voices.find(v=>/en-US/i.test(v.lang) && /samantha|google|natural/i.test(v.name)) ||
               voices.find(v=>/en-US/i.test(v.lang)) ||
               voices.find(v=>/en/i.test(v.lang));
  if(pref) u.voice = pref;
  window.speechSynthesis.speak(u);
}
// Force voices to load on some browsers
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = ()=>{};
  window.speechSynthesis.getVoices();
}

/* ============================================================
   PRACTICE SESSIONS
   ============================================================ */
let session = null;

function startMode(mode){
  session = {mode, idx:0, total:settings.dailyTarget, correct:0, wrong:0, questions:[]};
  if(mode==='cloze') buildClozeSession();
  else if(mode==='passage') buildPassageSession();
  else if(mode==='synant') buildSynAntSession();
  else if(mode==='confused') buildConfusedSession();
  else if(mode==='exam') buildExamSession();
  renderQuestion();
}

function buildExamSession(){
  // Practice ONLY words that have a src tag (exam vocabulary)
  const examWords = VOCAB.filter(v=>v.src);
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{
      v = examWords[Math.floor(Math.random()*examWords.length)];
      tries++;
    }while(used.has(v.w) && tries<30);
    used.add(v.w);
    // Mix question types: 60% cloze, 40% synonym/antonym/meaning-pick
    const r = Math.random();
    if(r < 0.6 && v.e){
      // Cloze
      const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\w*\\b","i"),"___");
      const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
      const distractors = pickDistractorsForWord(v, 3);
      const opts = shuffle([v.w, ...distractors]);
      session.questions.push({type:'cloze', target:v, stem:finalStem, opts, ans:v.w});
    } else {
      // Meaning pick: show word, choose correct Chinese meaning
      const wrongVocab = shuffle(VOCAB.filter(x=>x.w!==v.w && x.z!==v.z)).slice(0,3);
      const opts = shuffle([v.z, ...wrongVocab.map(x=>x.z)]);
      session.questions.push({type:'meaning', target:v, opts, ans:v.z});
    }
  }
}

function pickWeightedDueWord(){
  // Prefer words with low accuracy or due for review
  const now = Date.now();
  const candidates = VOCAB.map(v=>{
    const s = store.wordStats[v.w] || {seen:0,correct:0,wrong:0,dueAt:0};
    let weight = 1;
    if(s.seen===0) weight = 3; // new words
    else {
      const acc = s.correct/(s.seen||1);
      weight = 1 + (1-acc)*4;
      if(s.dueAt && s.dueAt < now) weight *= 2;
    }
    return {v, weight};
  });
  const total = candidates.reduce((a,b)=>a+b.weight,0);
  let r = Math.random()*total;
  for(const c of candidates){
    r -= c.weight;
    if(r<=0) return c.v;
  }
  return candidates[0].v;
}

function buildClozeSession(){
  const used = new Set();
  for(let i=0;i<session.total;i++){
    let v;
    let tries=0;
    do{ v = pickWeightedDueWord(); tries++; }while(used.has(v.w) && tries<30);
    used.add(v.w);
    // Build question: sentence with the word blanked
    const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\b","i"),"___");
    // If the exact word doesn't appear, try common inflections
    const finalStem = stem === v.e ? maskInflection(v.e, v.w) : stem;
    const distractors = pickDistractorsForWord(v, 3);
    const opts = shuffle([v.w, ...distractors]);
    session.questions.push({type:'cloze', target:v, stem:finalStem, opts, ans:v.w});
  }
}

function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

// If example uses an inflected form (e.g., "abided" for "abide"),
// mask the longest matching variant.
function maskInflection(text, base){
  // Irregular verb forms - manually handle common ones
  const IRREGULAR = {
    "slay":["slain","slew","slaying"],
    "withdraw":["withdrew","withdrawn","withdrawing"],
    "behold":["beheld","beholding"],
    "weigh":["weighed","weighing"],
    "thaw":["thawed","thawing"],
    "draft":["drafted","drafting"],
    "grind":["ground","grinding"],
    "gnash":["gnashed","gnashing"]
  };
  const variants = [base, base+'s', base+'es', base+'ed', base+'d', base+'ing',
                    base.replace(/e$/,'')+'ing', base.replace(/y$/,'ies'),
                    base.replace(/y$/,'ied')];
  if(IRREGULAR[base]) variants.push(...IRREGULAR[base]);
  variants.sort((a,b)=>b.length-a.length);
  for(const v of variants){
    const re = new RegExp("\\b"+escapeReg(v)+"\\b","i");
    if(re.test(text)) return text.replace(re, "___");
  }
  return text + " (___)";
}

function pickDistractorsForWord(target, n){
  const out = [];
  // Prefer words with same first letter or POS, or confused-pair partner
  const pool = VOCAB.filter(v=>v.w!==target.w);
  const shuffled = shuffle(pool.slice());
  // 1) Add confused partner if exists
  if(target.c){
    const partner = VOCAB.find(v=>v.w===target.c);
    if(partner) out.push(partner.w);
  }
  // 2) Same first letter
  for(const v of shuffled){
    if(out.length>=n) break;
    if(out.includes(v.w)) continue;
    if(v.w[0].toLowerCase()===target.w[0].toLowerCase()) out.push(v.w);
  }
  // 3) Same POS
  for(const v of shuffled){
    if(out.length>=n) break;
    if(out.includes(v.w)) continue;
    if(v.p===target.p) out.push(v.w);
  }
  // 4) Random
  for(const v of shuffled){
    if(out.length>=n) break;
    if(!out.includes(v.w)) out.push(v.w);
  }
  return out.slice(0,n);
}

function buildPassageSession(){
  const passages = shuffle(PASSAGES.slice()).slice(0, Math.min(PASSAGES.length, Math.max(2, Math.ceil(session.total/5))));
  session.total = passages.length;
  passages.forEach(p=>{
    session.questions.push({type:'passage', passage:p});
  });
}

function buildSynAntSession(){
  // Use words that have either s (synonym) or a (antonym)
  const candidates = VOCAB.filter(v=>v.s||v.a);
  const picked = shuffle(candidates).slice(0, session.total);
  session.total = picked.length;
  picked.forEach(v=>{
    const wantSyn = v.s && (!v.a || Math.random()<0.5);
    const ans = wantSyn ? v.s : v.a;
    const distractors = pickSynAntDistractors(v, ans, 3);
    const opts = shuffle([ans, ...distractors]);
    session.questions.push({type:'synant', target:v, mode:wantSyn?'syn':'ant', opts, ans});
  });
}

function pickSynAntDistractors(target, ans, n){
  // Pick from VOCAB and from other words' s/a fields, avoiding answer and target
  const allCandidates = new Set();
  VOCAB.forEach(v=>{
    if(v.w!==target.w && v.w!==ans) allCandidates.add(v.w);
    if(v.s && v.s!==ans && v.s!==target.w) allCandidates.add(v.s);
    if(v.a && v.a!==ans && v.a!==target.w) allCandidates.add(v.a);
  });
  return shuffle(Array.from(allCandidates)).slice(0,n);
}

function buildConfusedSession(){
  const pairKeys = Object.keys(CONFUSED_NOTES);
  const expanded = [];
  pairKeys.forEach(k=>{
    const [a,b] = k.split('|');
    const va = VOCAB.find(v=>v.w===a);
    const vb = VOCAB.find(v=>v.w===b);
    if(va) expanded.push({target:va, partner:vb||{w:b,z:'',e:''}, key:k});
    if(vb) expanded.push({target:vb, partner:va||{w:a,z:'',e:''}, key:k});
  });
  const picked = shuffle(expanded).slice(0, session.total);
  session.total = picked.length;
  picked.forEach(item=>{
    const v = item.target;
    const stem = v.e.replace(new RegExp("\\b"+escapeReg(v.w)+"\\b","i"),"___");
    const finalStem = stem===v.e ? maskInflection(v.e, v.w) : stem;
    // Options: target word, partner word, plus 2 distractors
    const partnerW = item.partner.w;
    const extras = pickDistractorsForWord(v, 2).filter(x=>x!==partnerW).slice(0,2);
    while(extras.length<2){
      const r = VOCAB[Math.floor(Math.random()*VOCAB.length)].w;
      if(r!==v.w && r!==partnerW && !extras.includes(r)) extras.push(r);
    }
    const opts = shuffle([v.w, partnerW, ...extras]);
    session.questions.push({type:'confused', target:v, stem:finalStem, opts, ans:v.w, key:item.key, partner:item.partner});
  });
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* --------------- Render question --------------- */
function renderQuestion(){
  if(session.idx >= session.total){
    return renderDone();
  }
  const q = session.questions[session.idx];
  if(q.type==='passage') return renderPassageQ(q);
  if(q.type==='synant') return renderSynAntQ(q);
  if(q.type==='confused') return renderConfusedQ(q);
  if(q.type==='meaning') return renderMeaningQ(q);
  return renderClozeQ(q);
}

  const app = document.getElementById('app');
  const isExamMode = session.mode === 'exam';
  app.innerHTML = `
    <div class="practice">
      ${renderPHead(isExamMode ? '考古題單字 · Exam Vocabulary' : '單字釋義 · Meaning')}
      <div class="q-prompt">下列哪個中文最符合此單字的意思？</div>
      <div class="q-target-row">
        <button class="speak-btn" onclick="speak('${q.target.w}')" title="發音">▶</button>
        <div class="q-target">${q.target.w}</div>
      </div>
      <div class="q-target-pos">${q.target.p}${q.target.src?'　·　'+q.target.src:''}</div>
      <div class="opts" id="optsBox">
        ${q.opts.map((o,i)=>`<button class="opt" data-w="${o.replace(/"/g,'&quot;')}" onclick="answerMeaning('${o.replace(/'/g,"\\'")}')">
          <span class="letter">${"ABCD"[i]}</span><span class="word plain" style="font-family:var(--cn)">${o}</span>
        </button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
      <div class="actions hidden" id="actions">
        <button class="btn ghost" onclick="quitSession()">結束</button>
        <button class="btn" onclick="nextQ()">下一題 →</button>
      </div>
    </div>
  `;
}

function answerMeaning(choice){
  const q = session.questions[session.idx];
  const isCorrect = choice === q.ans;
  document.querySelectorAll('#optsBox .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.w === q.ans) btn.classList.add('correct');
    else if(btn.dataset.w === choice && !isCorrect) btn.classList.add('wrong');
  });
  const fb = document.getElementById('fb');
  let html = '';
  if(isCorrect){
    html += `<div class="fb-tag">正確 · Correct</div>`;
    html += `<div><span class="ans-word">${q.target.w}</span> · <span class="ans-zh">${q.target.z}</span></div>`;
  } else {
    html += `<div class="fb-tag">再想想 · Review</div>`;
    html += `<div><span class="ans-word">${q.target.w}</span> 的正解：<span class="ans-zh">${q.target.z}</span></div>`;
  }
  if(q.target.e){
    const re = new RegExp("\\b("+escapeReg(q.target.w)+"\\w*)\\b","i");
    html += `<div class="ex">${q.target.e.replace(re,"<u>$1</u>")}</div>`;
  }
  if(q.target.src){
    html += `<div class="src-tag">📋 曾出現於 ${q.target.src.split('/').join('、')}</div>`;
  }
  fb.innerHTML = html;
  fb.classList.add('show', isCorrect?'ok':'ng');
  document.getElementById('actions').classList.remove('hidden');
  recordResult(q.target.w, isCorrect);
  bumpToday(isCorrect);
  if(isCorrect) session.correct++; else session.wrong++;
  if(parseInt(settings.autoSpeak)){
    setTimeout(()=>speak(q.target.w), 350);
  }
}

function renderPassageQ(q){
  const app = document.getElementById('app');
  const p = q.passage;
  // Render passage with all blanks
  let html = p.text;
  p.blanks.forEach(b=>{
    html = html.replace(`[[${b.idx}]]`,`<span class="blank" data-blank="${b.idx}" id="b${b.idx}">⟪${b.idx}⟫</span>`);
  });
  // Render each blank's options below
  app.innerHTML = `
    <div class="practice">
      ${renderPHead('段落填空 · Passage Cloze')}
      <div class="q-prompt"><strong style="font-style:italic;font-family:var(--serif);font-size:16px">${p.title}</strong></div>
      <div class="q-stem passage" id="passageText">${html}</div>
      <div id="passageBlanks"></div>
      <div class="feedback" id="fb"></div>
      <div class="actions hidden" id="actions">
        <button class="btn ghost" onclick="quitSession()">結束</button>
        <button class="btn" onclick="nextQ()">下一段 →</button>
      </div>
    </div>
  `;
  renderPassageBlanks(q, 0);
}

function renderPassageBlanks(q, currentIdx){
  const p = q.passage;
  const wrap = document.getElementById('passageBlanks');
  if(!q.userAnswers) q.userAnswers = {};
  if(currentIdx >= p.blanks.length){
    // All answered, show final feedback
    return finishPassage(q);
  }
  const b = p.blanks[currentIdx];
  // Highlight current blank
  document.querySelectorAll('#passageText .blank').forEach(el=>{
    el.style.background = '';
    el.style.color = '';
  });
  const cur = document.getElementById('b'+b.idx);
  if(cur){
    cur.style.background='rgba(168,107,42,.18)';
    cur.style.color='var(--ochre-deep)';
    cur.scrollIntoView({behavior:'smooth',block:'center'});
  }
  wrap.innerHTML = `
    <div class="q-prompt" style="margin-top:14px">空格 ⟪${b.idx}⟫ — 共 ${p.blanks.length} 格中的第 ${currentIdx+1} 格</div>
    <div class="opts" id="optsBox">
      ${shuffle(b.pool.slice()).map((o,i)=>`<button class="opt" data-w="${o}" onclick="answerPassageBlank('${o}',${currentIdx})">
        <span class="letter">${"ABCD"[i]}</span><span class="word">${o}</span>
      </button>`).join('')}
    </div>
  `;
}

function answerPassageBlank(choice, blankIdx){
  const q = session.questions[session.idx];
  const p = q.passage;
  const b = p.blanks[blankIdx];
  q.userAnswers[b.idx] = choice;
  const isCorrect = choice === b.ans;
  // Update DOM blank
  const cur = document.getElementById('b'+b.idx);
  if(cur){
    cur.textContent = choice;
    cur.classList.add('filled');
    cur.style.background='';
    if(!isCorrect){
      cur.classList.add('wrong');
      cur.title = '正解: ' + b.ans;
    }
  }
  // Mark options
  document.querySelectorAll('#optsBox .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.w === b.ans) btn.classList.add('correct');
    else if(btn.dataset.w === choice && !isCorrect) btn.classList.add('wrong');
  });
  // Record stat against the answer's word if it exists in vocab
  const targetVocab = VOCAB.find(v=>v.w===b.ans);
  if(targetVocab) recordResult(b.ans, isCorrect);
  bumpToday(isCorrect);
  if(isCorrect) session.correct++; else session.wrong++;
  setTimeout(()=>renderPassageBlanks(q, blankIdx+1), 700);
}

function finishPassage(q){
  const p = q.passage;
  const wrap = document.getElementById('passageBlanks');
  let correctCount = 0;
  p.blanks.forEach(b=>{ if(q.userAnswers[b.idx]===b.ans) correctCount++; });
  // Show all correct answers in passage
  document.querySelectorAll('#passageText .blank').forEach(el=>{
    el.style.background='';
  });
  wrap.innerHTML = `
    <div class="feedback ${correctCount===p.blanks.length?'ok':'ng'} show" style="display:block">
      <div class="fb-tag">${correctCount===p.blanks.length?'全對 ✓':'答對 '+correctCount+' / '+p.blanks.length}</div>
      <div>各空格正解：${p.blanks.map(b=>`<span class="ans-word">${b.ans}</span>`).join('、')}</div>
    </div>
  `;
  document.getElementById('actions').classList.remove('hidden');
}

function renderPHead(title){
  return `<div class="p-head">
    <div class="p-mode">${title}</div>
    <div class="p-prog">${session.idx+1} / ${session.total}</div>
    <button class="p-close" onclick="quitSession()" title="返回">✕</button>
  </div>`;
}

function answer(choice){
  const q = session.questions[session.idx];
  const isCorrect = choice === q.ans;
  // Lock options
  document.querySelectorAll('#optsBox .opt').forEach(btn=>{
    btn.disabled = true;
    if(btn.dataset.w === q.ans) btn.classList.add('correct');
    else if(btn.dataset.w === choice && !isCorrect) btn.classList.add('wrong');
  });
  // Update blank in stem
  const slot = document.getElementById('blankSlot');
  if(slot){
    slot.textContent = choice;
    slot.classList.add('filled');
    if(!isCorrect) slot.classList.add('wrong');
  }
  // Build feedback
  const fb = document.getElementById('fb');
  const target = q.target;
  const ansVocab = VOCAB.find(v=>v.w===q.ans) || target;
  let html = '';
  if(isCorrect){
    html += `<div class="fb-tag">正確 · Correct</div>`;
    html += `<div><span class="ans-word">${q.ans}</span> · <span class="ans-zh">${ansVocab.z||''}</span></div>`;
  }else{
    html += `<div class="fb-tag">再想想 · Review</div>`;
    html += `<div>正解：<span class="ans-word">${q.ans}</span> · <span class="ans-zh">${ansVocab.z||''}</span></div>`;
  }
  // Add example sentence with target highlighted
  if(ansVocab && ansVocab.e){
    const re = new RegExp("\\b("+escapeReg(ansVocab.w)+"\\w*)\\b","i");
    html += `<div class="ex">${ansVocab.e.replace(re,"<u>$1</u>")}</div>`;
  }
  // Show exam source tag if applicable
  if(ansVocab && ansVocab.src){
    html += `<div class="src-tag">📋 曾出現於 ${ansVocab.src.split('/').join('、')}</div>`;
  }
  // For confused-mode, add the comparison note
  if(q.type==='confused' && q.key && CONFUSED_NOTES[q.key]){
    html += `<div class="conf-note">${CONFUSED_NOTES[q.key]}</div>`;
  }
  // For synant, briefly explain
  if(q.type==='synant'){
    const partnerVocab = VOCAB.find(v=>v.w===q.ans);
    if(partnerVocab && partnerVocab.z){
      html += `<div class="conf-note">${q.mode==='syn'?'同義字':'反義字'} <span class="ans-word">${q.ans}</span> 意為 ${partnerVocab.z}</div>`;
    }
  }
  fb.innerHTML = html;
  fb.classList.add('show', isCorrect?'ok':'ng');
  document.getElementById('actions').classList.remove('hidden');
  recordResult(target.w, isCorrect);
  bumpToday(isCorrect);
  if(isCorrect) session.correct++; else session.wrong++;
  // Auto-speak the correct answer
  if(parseInt(settings.autoSpeak)){
    setTimeout(()=>speak(q.ans), 350);
  }
}

function nextQ(){
  session.idx++;
  renderQuestion();
}

function renderDone(){
  const acc = session.correct + session.wrong > 0
    ? Math.round(100*session.correct/(session.correct+session.wrong)) : 0;
  let msg = '';
  if(acc>=90) msg = '表現優異，繼續保持。';
  else if(acc>=70) msg = '熟練度穩定。可重複練習答錯的字加強鞏固。';
  else if(acc>=50) msg = '已掌握部分字彙，建議檢視「需要加強的字」清單。';
  else msg = '別氣餒，這些字本來就難。從錯題回頭看例句，會記得更牢。';
  document.getElementById('app').innerHTML = `
    <header class="masthead">
      <div class="eyebrow">SESSION COMPLETE</div>
      <h1 class="title">這次練習結束<span class="cn">本回合結果</span></h1>
    </header>
    <div class="done">
      <div class="big-num">${session.correct}<span class="slash"> / </span>${session.correct+session.wrong}</div>
      <div class="ratio-l">正確率 ${acc}%</div>
      <div class="msg">${msg}</div>
      <div class="actions">
        <button class="btn ghost" onclick="renderHome()">回到首頁</button>
        <button class="btn" onclick="startMode('${session.mode}')">再來一回 →</button>
      </div>
    </div>
  `;
  session = null;
}

function quitSession(){
  if(session && session.idx>0){
    if(!confirm('要結束目前練習回到首頁嗎？')) return;
  }
  session = null;
  renderHome();
}

/* ============================================================
   SETTINGS
   ============================================================ */
function openSettings(){
  document.getElementById('setDaily').value = settings.dailyTarget;
  document.getElementById('setRate').value = settings.speechRate;
  document.getElementById('setAutoSpeak').value = settings.autoSpeak;
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){
  settings.dailyTarget = Math.min(100, Math.max(5, parseInt(document.getElementById('setDaily').value)||20));
  settings.speechRate = parseFloat(document.getElementById('setRate').value)||0.85;
  settings.autoSpeak = parseInt(document.getElementById('setAutoSpeak').value)||0;
  saveSettings(settings);
  document.getElementById('settingsModal').classList.remove('show');
  renderHome();
}
function resetAll(){
  if(!confirm('確定要清除所有學習進度？此動作無法復原。')) return;
  localStorage.removeItem(STORE_KEY);
  store = loadStore();
  document.getElementById('settingsModal').classList.remove('show');
  renderHome();
}
function exportProgress(){
  const data = JSON.stringify({store, settings, exportedAt:new Date().toISOString()}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '後中醫單字學習進度_'+todayKey()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importProgress(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(d.store) {store = d.store; saveStore(store);}
        if(d.settings) {settings = Object.assign({},DEFAULT_SETTINGS,d.settings); saveSettings(settings);}
        alert('進度匯入成功');
        renderHome();
      }catch(err){ alert('檔案格式錯誤：'+err.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

/* Boot */
renderHome();
</script>
